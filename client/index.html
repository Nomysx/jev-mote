<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Mote</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23e8a87c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-hidden="true"></div>
      <div id="mind" class="mind-layer" aria-hidden="true"></div>
      <div id="status" class="status-card" hidden></div>
      <header class="top-bar">
        <nav>
          <button type="button" class="icon-btn" id="btn-sound" aria-pressed="true" title="Sound">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /></svg>
            <span class="label">Sound</span>
          </button>
          <button type="button" class="icon-btn" id="btn-journal" title="Your entries, Mote's dreams and its inner life">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z" /><path d="M5 17a3 3 0 0 1 3-3h11" /></svg>
            <span class="label">Journal</span>
          </button>
          <button type="button" class="icon-btn" id="btn-growth" title="How Mote is growing">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9" /><path d="M12 12c0-4 3-7 7-7 0 4-3 7-7 7z" /><path d="M12 14c0-3-2.5-5.5-6-5.5 0 3 2.5 5.5 6 5.5z" /></svg>
            <span class="label">Growth</span>
          </button>
          <button type="button" class="icon-btn" id="btn-settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" /></svg>
            <span class="label">Settings</span>
          </button>
          <button type="button" class="icon-btn" id="btn-debug" hidden>Debug</button>
        </nav>
      </header>
      <div class="widget-bar" aria-label="Widget controls">
        <span class="drag" title="Drag to move"></span>
        <button type="button" class="mini-btn" id="w-open" title="Open the full window" aria-label="Open the full window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7" /></svg>
        </button>
        <button type="button" class="mini-btn" id="w-hide" title="Hide (Mote keeps living in the tray)" aria-label="Hide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
      </div>
      <div id="wellbeing" class="wellbeing" hidden></div>
      <div id="away" class="away-card" hidden role="region" aria-label="While you were away"></div>
      <div id="welcome" class="welcome" hidden role="dialog" aria-label="Welcome"></div>
      <form id="composer" class="composer" autocomplete="off">
        <button type="button" id="dream-offer" class="dream-offer" hidden>Mote had a dream. Watch it</button>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <div class="composer-box">
          <textarea id="entry" rows="1" maxlength="20000" placeholder="Write to Mote…" aria-label="Journal entry (press Enter to save)" enterkeyhint="send"></textarea>
        </div>
      </form>
      <aside id="journal" class="panel panel-left" hidden aria-label="Journal"></aside>
      <aside id="settings" class="panel panel-right" hidden aria-label="Settings"></aside>
      <aside id="setup" class="setup-panel" hidden aria-label="Set up Mote"></aside>
      <aside id="growth" class="mindmap" hidden aria-label="How Mote is growing"></aside>
      <aside id="debug" class="debug-panel" hidden aria-label="Debug panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
